<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen.</title>
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <h1 class="header__title">Lumen.</h1>
            <nav class="header__mainmenu">
                <ul>
                    <li><a class="mainmenu__link" href="">О нас</a></li>
                    <li><a class="mainmenu__link" href="">Каталог</a></li>
                    <li><a class="mainmenu__link" href="">Обратная связь</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section banner">
            <div class="container">
                2
            </div>
        </section>
        <section class="section about">
            <div class="container">
                3
            </div>
        </section>
        <section class="section catalog">
            <div class="container">
                <h2 class="catalog__title">Каталог</h2>
                <div class="catalog">
                    <div class="catalog__wrapper">
                        <div class="catalog__container">
                            <div class="catalog__card">
                                <img class="card__img" src="img/catalog1.jpg" alt="">
                                <h3 class="card__title">Where Shadows Learn to Dance</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                                <button class="card__btn-add" aria-label="добавить в избранное">+</button>
                            </div>
                            <div class="catalog__card">
                                <img class="card__img" src="img/catalog2.jpg" alt="">
                                <h3 class="card__title">The Long Echo of Evening</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                                <button class="card__btn-add" aria-label="добавить в избранное">+</button>
                            </div>
                            <div class="catalog__card">
                                <img class="card__img" src="img/catalog3.jpg" alt="">
                                <h3 class="card__title">Still</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                                <button class="card__btn-add" aria-label="добавить в избранное">+</button>
                            </div>
                            <div class="catalog__card">
                                <img class="card__img" src="img/catalog4.jpg" alt="">
                                <h3 class="card__title">Dusk</h3>
                                <p class="card__price">2000 &#8381;</p>
                                <button class="card__btn">связаться</button>
                                <button class="card__btn-add" aria-label="добавить в избранное">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="catalog__button">
                        <button class="catalog__btn" aria-label="назад">

                                xmlns="http://www.w3.org/2000/svg">

                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <section class="section feedback">
            <div class="container feedback__container">
                <div class="feedback__intro">
                    <h2 class="feedback__title">ОСТАЛИСЬ ВОПРОСЫ?</h2>
                    <img class="feedback__img" src="img/feedback.jpg" alt="">
                </div>
                <div class="feedback__main">
                    <form class="feedback__form" action="#">
                        <div class="form__item">
                            <input class="form__elem form__input" type="text" name="name" placeholder="имя" required>
                            <svg class="form__icon" width="30" height="30" viewBox="0 0 30 30" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <circle cx="15" cy="9" r="5" stroke="#FF7931" stroke-width="3" />
                                <path
                                    d="M4 27V25.5C4 21.5 8.5 18.5 15 18.5C21.5 18.5 25.5 21.5 25.5 25.5V27"
                                    stroke="#FF7931" stroke-width="3" stroke-linecap="round" />
                            </svg>
                        </div>
                        <div class="form__item">
                            <input class="form__elem form__input" type="tel" name="phone" placeholder="телефон" required>
                            <svg class="form__icon" width="30" height="30" viewBox="0 0 30 30" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M25.9108 18.6625L21.5619 16.7392C21.1794 16.5692 20.7548 16.5325 20.3512 16.6336C19.9475 16.7348 19.5866 16.9683 19.3229 16.9992L14.8452 20.4283C11.5625 18.8683 8.8627 16.1292 7.29695 12.775L10.6877 8.2325C11.0027 7.96583 11.2349 7.59917 11.3349 7.19083C11.4365 6.7825 11.4003 6.3525 11.2329 5.96583L9.33695 1.55833C9.14995 1.12417 8.81745 0.774167 8.39795 0.5725C7.97845 0.370833 7.50045 0.330833 7.05495 0.459167C4.67245 1.12417 2.56295 2.60167 1.06295 4.65417C-0.437046 6.70667 1.08124e-05 9.09417 0.0524611 11.5658C0.107461 14.0642 1.1027 16.4275 2.8427 18.1908C5.5577 22.5275 9.36895 26.3825 13.6452 29.1292C15.3852 30.8958 17.7127 31.8958 20.1727 31.9508C22.5877 32.0483 24.9408 30.6342 26.9672 29.1142C28.9935 27.5942 30.4485 25.4492 31.1052 23.0292C31.2327 22.5775 31.1929 22.0933 30.9942 21.6675C30.7954 21.2417 30.4484 20.905 30.0172 20.7158L25.9108 18.6625V18.6625Z"

                            </svg>
                        </div>
                        <div class="form__item">
                            <input class="form__elem form__input" type="email" name="mail" placeholder="email" required>
                            <svg class="form__icon" width="30" height="30" viewBox="0 0 30 30" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M1.5 10.5L13.0575 18.1725C14.0962 18.8487 15.4038 18.8487 16.4425 18.1725L28 10.5"
                                    stroke="#FF7931" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                                <path
                                    d="M1.5 14.8069V6.44325C1.5 4.13625 3.35175 2.2665 5.63625 2.2665H23.8637C26.1482 2.2665 28 4.13625 28 6.44325V14.8069V21.1931C28 23.5001 26.1482 25.3699 23.8637 25.3699H5.63625C3.35175 25.3699 1.5 23.5001 1.5 21.1931V14.8069Z"
                                    stroke="#FF7931" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <div class="form__item">
                            <textarea class="form__elem form__textarea" name="message"
                                placeholder="напишите ваш вопрос" required></textarea>
                            <svg class="form__icon" width="30" height="30" viewBox="0 0 30 30"
                                fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M15.5595 7.43583L3.90375 19.2133C3.4125 19.7108 3.14625 20.3858 3.1725 21.0817L3.4065 27.5458L9.7935 27.5767H9.81975C10.5045 27.5767 11.157 27.3083 11.6385 26.8283L23.3025 15.0508M15.5595 7.43583L18.363 4.59833C19.869 3.07333 22.308 3.07333 23.814 4.59833L26.0145 6.82833C27.5205 8.35333 27.5205 10.8233 26.0145 12.3483L23.3025 15.0508M15.5595 7.43583L23.3025 15.0508"

                        <div class="form__item">
                            <input class="form__elem form__submit" type="submit" value="отправить">
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <section class="section contacts">
            <div class="container">
                6
            </div>
        </section>
        <section class="section copyright">
            <div class="container">
                7
            </div>
        </section>
    </footer>
